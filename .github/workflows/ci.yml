name: 构建验证

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  maven:
    name: Maven 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 执行 Maven 测试
        run: ./mvnw -B test

  runtime-adapter:
    name: Runtime Adapter 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 执行 Runtime Adapter 合同测试
        run: ./mvnw -B -Pruntime-adapter -pl ent-loom-integrations/ent-loom-runtime-adapter -am test

  docs:
    name: Docusaurus 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: docs-site/.node-version
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: 安装文档站依赖
        run: npm ci
      - name: 检查 TypeScript 类型
        run: npm run typecheck
      - name: 构建文档站
        run: npm run build
