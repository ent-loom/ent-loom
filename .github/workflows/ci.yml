name: 构建验证

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  maven:
    name: Maven 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 执行 Maven 测试
        run: ./mvnw -B test

  runtime-adapter:
    name: Runtime Adapter 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 执行 Runtime Adapter 合同测试
        run: ./mvnw -B -Pruntime-adapter -pl ent-loom-integrations/ent-loom-runtime-adapter -am test

  customer-profile:
    name: 单表示例 MySQL 验收
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 安装工作区构件到隔离仓库
        run: ./mvnw -B -Dmaven.repo.local="$RUNNER_TEMP/customer-profile-m2" -DskipTests -Dmaven.javadoc.skip=true install
      - name: 检查验收脚本资源清理
        run: python3 -B -m unittest discover -s examples/customer-profile-spring-boot/scripts -p 'test_*.py'
      - name: 验收独立消费者
        working-directory: examples/customer-profile-spring-boot
        run: python3 scripts/verify.py --maven-repository "$RUNNER_TEMP/customer-profile-m2"
      - name: 保留验收日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-profile-verification-logs
          path: examples/customer-profile-spring-boot/target/verification-logs/
          if-no-files-found: ignore

  public-consumer-build:
    name: Maven Central 独立构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 使用全新 Maven 仓库构建公开消费者
        working-directory: examples/customer-profile-spring-boot
        run: ../../mvnw -B -Dmaven.repo.local="$RUNNER_TEMP/central-consumer-m2" -DskipTests package

  mini-commerce:
    name: 最小商城 MySQL 验收
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 安装工作区构件到隔离仓库
        run: ./mvnw -B -Dmaven.repo.local="$RUNNER_TEMP/mini-commerce-m2" -DskipTests -Dmaven.javadoc.skip=true install
      - name: 检查验收脚本资源清理
        run: python3 -B -m unittest discover -s examples/mini-commerce-spring-boot/scripts -p 'test_*.py'
      - name: 验收独立消费者
        working-directory: examples/mini-commerce-spring-boot
        run: python3 scripts/verify.py --maven-repository "$RUNNER_TEMP/mini-commerce-m2"
      - name: 保留验收日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-commerce-verification-logs
          path: examples/mini-commerce-spring-boot/target/verification-logs/
          if-no-files-found: ignore

  docs:
    name: Docusaurus 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: docs-site/.node-version
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: 安装文档站依赖
        run: npm ci
      - name: 检查 TypeScript 类型
        run: npm run typecheck
      - name: 构建文档站
        run: npm run build
