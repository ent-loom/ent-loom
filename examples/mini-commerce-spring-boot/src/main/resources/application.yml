# 运行基础：本地与 Compose 使用同一组环境变量。
spring:
  config:
    import:
      - classpath:demo.yml
      - optional:file:./.env[.properties]
  application:
    name: mini-commerce-spring-boot
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:mini_commerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:mini_commerce}
    password: ${MYSQL_PASSWORD:mini_commerce_dev}

server:
  port: ${APP_PORT:8082}

ent:
  loom:
    # CRUD、DDL 与文档共用实体元数据。
    meta:
      defaults:
        # 创建时间默认识别 createTime / createdAt，所有实体无需逐字段注解。
        id-policy: DATABASE
        service: mini-commerce
      base-packages:
        - com.example.minicommerce.*.entity

    crud:
      # 通用 HTTP 仅发布有 CRUD 声明且未关闭的实体；默认策略不自动发布内部实体。
      controller:
        enabled: true
    # 开发环境按实体同步表结构，包含删除多余列。
    ddl:
      mode: CREATE_MODIFY_DELETE_ALL
     # 实体文档仅向演示主体开放。
    doc:
      contract:
        enabled: true
        exposure:
          subject-ids: [local-developer]
        http:
          enabled: true
