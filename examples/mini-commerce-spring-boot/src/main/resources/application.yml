# 运行基础：本地与 Compose 使用同一组环境变量。
spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: mini-commerce-spring-boot
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:mini_commerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:mini_commerce}
    password: ${MYSQL_PASSWORD:mini_commerce_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${APP_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health

ent:
  loom:
    # 按实体定义创建缺失的表；不修改已有表结构或清空数据。
    ddl:
      enabled: true
      mode: CREATE_TABLE
      base-packages:
        - com.example.minicommerce.*.entity

    # 实体元数据：扫描业务实体，为 CRUD 与文档提供统一定义。
    meta:
      defaults:
        service: mini-commerce
      base-packages:
        - com.example.minicommerce.*.entity
      crud:
        enabled: true
      doc:
        enabled: true

    crud:
      # 所有未显式声明主键策略的实体默认使用数据库生成主键。
      defaults:
        id-policy: GENERATED
      # HTTP 接口：暴露已注册实体；订单明细通过黑名单关闭独立接口。
      controller:
        enabled: true
        exposure-mode: ALL_REGISTERED
        exclude-entities:
          - orderItem
      query:
        enabled: true
      command:
        enabled: true

      # 写入契约：创建必填项与更新禁改项。
      contracts:
        create:
          input-required-fields:
            product: [name, price, active]
            customer: [displayName, email]
        update:
          forbidden-fields:
            product: [id]
            customer: [id]

      # 演示主体 local-developer 与全量数据范围，由 Starter 提供。
      # 读取可见性仍会进一步约束商品查询；生产接入应替换演示身份与数据范围。
      example:
        enabled: true
      governance:
        # 固定业务入口；管理端对照演示通过启动参数改为 management。
        access-entry: consumer
        # 客户不开放删除，避免订单失去关联；订单只允许读取与下单。
        grants:
          local-developer:
            - product:*
            - customer:read
            - customer:create
            - customer:update
            - order:read
            - order:place
        # 商品读取：消费者只看启用商品，管理端允许全部状态。
        read-visibility:
          product:
            consumer:
              active: true
            management: all
        # 示例无需额外审计表。
        audit:
          persist-to-jdbc: false

    # 实体文档：限定访问主体、实体与公开字段。
    doc:
      contract:
        enabled: true
        exposure:
          enabled: true
          subject-ids: [local-developer]
          fields:
            product: [id, name, price, active]
            customer: [id, displayName, email]
        http:
          enabled: true
