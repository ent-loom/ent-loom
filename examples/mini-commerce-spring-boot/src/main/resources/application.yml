# 运行基础：本地与 Compose 使用同一组环境变量。
spring:
  config:
    import:
      - classpath:demo.yml
      - optional:file:./.env[.properties]
  application:
    name: mini-commerce-spring-boot
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:mini_commerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:mini_commerce}
    password: ${MYSQL_PASSWORD:mini_commerce_dev}

server:
  port: ${APP_PORT:8082}

ent:
  loom:
    # 按实体元数据创建缺失表。
    ddl:
      mode: CREATE_TABLE
    # CRUD、DDL 与文档共用实体元数据。
    meta:
      defaults:
        id-policy: DATABASE
        service: mini-commerce
      base-packages:
        - com.example.minicommerce.*.entity

    crud:
      # 业务访问：谁能执行什么操作、访问哪些数据与字段。
      access:
        # ID 字段默认采用“身份码 + Id”。
        identities:
          customer:
            id-type: LONG
          merchant:
            id-type: LONG
        # 保护实体已有的归属字段，禁止普通写入。
        defaults:
          scope-fields: [merchantId, customerId]
        # 按实体资源码命名策略，分支声明客户 / 商家的能力。
        policies:
          customerAddress:
            customer:
              actions: [view]
              fields: customerAddress
          merchantPoster:
            merchant:
              actions: [view]
              fields: merchantPoster
          merchantProduct:
            merchant:
              actions: [view, update]
              fields: merchantProduct
          merchantOrder:
            customer:
              actions: [view]
              fields: customer-orders
            merchant:
              actions: [view]
              fields: merchant-orders
        # 显式登记操作，默认绑定同名策略。
        entities:
          # 结算单由下单场景写入，customerId 是业务关联字段。
          order:
            exclude-scope-fields: [customerId]
          customerAddress:
            operations:
              view: [LIST, PAGE]
          merchantPoster:
            operations:
              view: [LIST, PAGE]
          merchantProduct:
            operations:
              view: [LIST]
              update: [UPDATE]
          merchantOrder:
            operations:
              view: [PAGE]
        # 策略范围默认采用同名身份关系。
        relations:
          merchant:
            field: merchantId
          customer:
            field: customerId
        # FILTER 缺省复用可返回且可筛选字段；显式列表覆盖缺省，[] 关闭筛选。
        field-plans:
          customerAddress:
            RETURN: [id, customerId, recipient, phone, address]
          merchantPoster:
            RETURN: [id, merchantId, title, content]
          merchantProduct:
            RETURN: [id, merchantId, name, price, active, version]
            WRITE: [name, price, active]
          customer-orders:
            RETURN: [id, orderId, customerId, merchantId, totalAmount]
          merchant-orders:
            RETURN: [id, orderId, customerId, merchantId, totalAmount]
      # 通用 HTTP 仅开放客户与结算单。
      controller:
        enabled: true
        include-entities: [customer, order]
      # 写入契约：创建请求必须显式提供的字段。
      contracts:
        create:
          input-required-fields:
            customer: [displayName, email]

    # 实体文档仅向演示主体开放。
    doc:
      contract:
        enabled: true
        exposure:
          subject-ids: [local-developer]
        http:
          enabled: true
