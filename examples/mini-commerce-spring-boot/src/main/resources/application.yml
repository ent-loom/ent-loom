# 运行基础：本地与 Compose 使用同一组环境变量。
spring:
  config:
    import:
      - classpath:demo.yml
      - optional:file:./.env[.properties]
  application:
    name: mini-commerce-spring-boot
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:mini_commerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:mini_commerce}
    password: ${MYSQL_PASSWORD:mini_commerce_dev}

server:
  port: ${APP_PORT:8082}

ent:
  loom:
    # 按实体元数据创建缺失表。
    ddl:
      mode: CREATE_TABLE
    # CRUD、DDL 与文档共用实体元数据。
    meta:
      defaults:
        id-policy: DATABASE
        service: mini-commerce
      base-packages:
        - com.example.minicommerce.*.entity

    crud:
      # 业务访问：谁能执行什么操作、访问哪些数据与字段。
      access:
        # ID 字段默认采用“身份码 + Id”。
        identities:
          customer:
            id-type: LONG
          merchant:
            id-type: LONG
        # 保护实体已有的归属字段，禁止普通写入。
        defaults:
          scope-fields: [merchantId, customerId]
        # 项目按业务规则定义模板，实体显式选择；同类实体可复用。
        policies:
          # 客户只读本人记录。
          customer-record:
            customer:
              actions: [view]
          # 商家只读本人记录。
          merchant-record:
            merchant:
              actions: [view]
          # 商家读取、维护本人数据；字段差异由实体约束。
          merchant-data:
            merchant:
              actions: [view, update]
          # 订单由客户与商家分别按自己的归属读取。
          order-entries:
            customer:
              actions: [view]
            merchant:
              actions: [view]
        # 实体选择模板；标准 CRUD 映射复用策略动作缺省，特殊映射再显式声明。
        entities:
          # 结算单由下单场景写入，customerId 是业务关联字段。
          order:
            exclude-scope-fields: [customerId]
          customerAddress:
            policy: customer-record
          merchantPoster:
            policy: merchant-record
          merchantProduct:
            policy: merchant-data
          merchantOrder:
            policy: order-entries
        # 策略范围默认采用同名身份关系。
        relations:
          merchant:
            field: merchantId
          customer:
            field: customerId
        # RETURN 缺省为普通字段，FILTER 缺省复用可筛选返回字段；写入仍显式授权。
        field-plans:
          merchantProduct:
            WRITE: [name, price, active]
      # 通用 HTTP 仅开放客户与结算单。
      controller:
        enabled: true
        include-entities: [customer, order]
      # 写入契约：创建请求必须显式提供的字段。
      contracts:
        create:
          input-required-fields:
            customer: [displayName, email]

    # 实体文档仅向演示主体开放。
    doc:
      contract:
        enabled: true
        exposure:
          subject-ids: [local-developer]
        http:
          enabled: true
