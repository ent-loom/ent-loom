# 运行基础：本地与 Compose 使用同一组环境变量。
spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: mini-commerce-spring-boot
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:mini_commerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:mini_commerce}
    password: ${MYSQL_PASSWORD:mini_commerce_dev}

server:
  port: ${APP_PORT:8082}

# 双端治理演示：令牌仅供本地运行，客户/商家归属由服务端账号配置确定。
# 正式接入替换 CrudHttpAuthenticationSource 与 BusinessIdentityRegistration 的解析器。
demo:
  customer:
    accounts:
      - token: demo-customer-a
        subject-id: customer-user-a
        customer-id: 301
      - token: demo-customer-b
        subject-id: customer-user-b
        customer-id: 302
  merchant:
    accounts:
      - token: demo-merchant-a
        subject-id: merchant-user-a
        merchant-id: 1001
      - token: demo-merchant-b
        subject-id: merchant-user-b
        merchant-id: 2001

ent:
  loom:
    # 默认复用 Meta 扫描的实体创建缺失的表；不修改已有表结构或清空数据。
    ddl:
      mode: CREATE_TABLE
    # 实体元数据：只扫描业务实体包，为 CRUD、DDL 与文档提供统一定义。
    meta:
      # CRUD 与 DDL 共用主键语义，MySQL 整数主键映射为自增。
      defaults:
        id-policy: DATABASE
        service: mini-commerce
      base-packages:
        - com.example.minicommerce.*.entity

    crud:
      # 业务策略：身份核验仍由 Java 完成，声明在启动时编译并冻结。
      access:
        # 全局候选：只匹配实体已有字段，统一保护归属写入；授权范围由策略分支决定。
        defaults:
          scope-fields: [merchantId, customerId]
        # 策略名下的 customer / merchant 是可信访问身份，不是实体资源码。
        policies:
          customer-address:
            customer:
              actions: [view]
              fields: customer-address
          merchant-poster:
            merchant:
              actions: [view]
              fields: merchant-poster
          merchant-pricing:
            merchant:
              actions: [view, update]
              fields: pricing
          order-entries:
            customer:
              actions: [view]
              fields: customer-orders
            merchant:
              actions: [view]
              fields: merchant-orders
        # customerAddress / merchantPoster 才是被访问的实体；身份关系决定“谁的数据”。
        entities:
          # 客户结算单由下单场景创建，普通 CRUD 不绑定商家或客户范围。
          order:
            exclude-scope-fields: [customerId]
          customerAddress:
            policy: customer-address
            operations:
              view: [LIST, PAGE]
          merchantPoster:
            policy: merchant-poster
            operations:
              view: [LIST, PAGE]
          merchantProduct:
            policy: merchant-pricing
            operations:
              view: [LIST]
              update: [UPDATE]
          merchantOrder:
            policy: order-entries
            operations:
              view: [PAGE]
        # scope 缺省取身份名称；identity-field 缺省取“关系名称 + Id”。
        # customer / merchant 在这里是归属关系角色，field 指向被访问实体的归属字段。
        relations:
          merchant:
            field: merchantId
          customer:
            field: customerId
        # fields 引用命名方案；未列出的字段用途不可使用，且与实体静态上限取交集。
        field-plans:
          customer-address:
            RETURN: [id, customerId, recipient, phone, address]
            SORT: [id]
          merchant-poster:
            RETURN: [id, merchantId, title, content]
            SORT: [id]
          pricing:
            RETURN: [id, merchantId, name, price, active, version]
            WRITE: [name, price, active]
          customer-orders:
            RETURN: [id, orderId, customerId, merchantId, totalAmount]
            FILTER: [merchantId]
            SORT: [id]
          merchant-orders:
            RETURN: [id, orderId, customerId, merchantId, totalAmount]
            FILTER: [customerId]
            SORT: [id]
      # 通用 HTTP 只开放白名单；新增实体默认不暴露，内部授权查询与 DAO 不受影响。
      controller:
        enabled: true
        include-entities: [customer, order]
      # 写入契约：创建请求必须显式提供的字段。
      contracts:
        create:
          input-required-fields:
            customer: [displayName, email]

      # 仅为本示例提供一个固定请求主体和全量数据范围，便于直接运行。
      # 这不是登录、角色或生产授权配置；生产接入应替换主体解析和数据范围实现。
      example:
        enabled: true
        # 原通用 CRUD 请求共用此主体；双端自定义接口另外要求有效令牌和 CustomerIdentity / MerchantIdentity。
        subject-id: local-developer
        # 显式展示演示默认值：Gateway 与 DAO 不限制数据归属，读取可见性仍单独生效。
        allow-all-data-scope: true
      governance:
        # 原通用 CRUD 固定使用的业务入口；双端自定义接口由 DemoAccessConfiguration 按服务端路由确定。
        # 入口不是登录身份或角色；切换入口不会切换主体及其权限。
        # consumer=消费者，merchant=商家，management=平台管理；名称由业务应用约定。
        # 当前仅配置 consumer / management；商家商品由商家专用接口维护。
        # 多端同时访问时，应由服务端根据已认证身份与受保护路由解析入口，详见 README。
        access-entry: consumer
        # 示例主体的业务权限清单：subject -> resource:action。
        # * 通配该资源的操作与场景，仍受动作准入等约束；place 是显式下单动作。
        # grants 按主体匹配，不会按 access-entry 自动分组。
        # 正式接入应按登录主体解析角色权限，避免把这里的演示权限当作消费者角色。
        grants:
          local-developer:
            - customer:read
            - customer:create
            - customer:update
            - order:read
            - order:place
        # 示例无需额外审计表。
        audit:
          persist-to-jdbc: false

    # 实体文档：限定访问主体，默认展示 Meta 注册的全部实体与非隐藏字段。
    doc:
      contract:
        enabled: true
        exposure:
          subject-ids: [local-developer]
        http:
          enabled: true
