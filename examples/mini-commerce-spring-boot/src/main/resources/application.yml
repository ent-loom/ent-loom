# 运行基础：本地与 Compose 使用同一组环境变量。
spring:
  config:
    import:
      - classpath:demo.yml
      - classpath:crud-policies.yml
      - optional:file:./.env[.properties]
  application:
    name: mini-commerce-spring-boot
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:mini_commerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:mini_commerce}
    password: ${MYSQL_PASSWORD:mini_commerce_dev}

server:
  port: ${APP_PORT:8082}

mybatis-plus:
  global-config:
    db-config:
      # 与 Ent Loom 的 DATABASE 主键策略保持一致，id 字段无需逐个声明 @TableId。
      id-type: auto

ent:
  loom:
    # CRUD、DDL 与文档共用实体元数据。
    meta:
      defaults:
        # 创建时间默认识别 createTime / createdAt，所有实体无需逐字段注解。
        id-policy: DATABASE
        service: mini-commerce
      base-packages:
        - com.example.minicommerce.*.entity

    crud:
      defaults:
        actions: [view, create, update, delete]
      # 身份结构；通用基线在 crud-policies.yml，实体特例在 @EntCrudGrant，全局归属与管理员默认在 grant-defaults。
      grant-defaults:
        owner-fields:
          merchant: merchantId
          customer: customerId
        wildcard-identities: [super-admin]
      identities:
        customer:
          id-type: LONG
        merchant:
          id-type: LONG
        super-admin:
          id-type: LONG
          id-field: superAdminId
      # 通用 HTTP 仅发布有 CRUD 声明且未关闭的实体，开放不代表授权。
      controller:
        enabled: true
    # 开发环境按实体同步表结构，包含删除多余列。
    ddl:
      mode: CREATE_MODIFY_DELETE_ALL
     # 实体文档仅向演示主体开放。
    doc:
      contract:
        enabled: true
        exposure:
          subject-ids: [local-developer]
        http:
          enabled: true
