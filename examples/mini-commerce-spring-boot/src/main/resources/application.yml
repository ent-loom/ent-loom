# 运行基础：本地与 Compose 使用同一组环境变量。
spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: mini-commerce-spring-boot
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:mini_commerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:mini_commerce}
    password: ${MYSQL_PASSWORD:mini_commerce_dev}

server:
  port: ${APP_PORT:8082}

ent:
  loom:
    # 默认复用 Meta 扫描的实体创建缺失的表；不修改已有表结构或清空数据。
    ddl:
      mode: CREATE_TABLE
    # 实体元数据：只扫描业务实体包，为 CRUD、DDL 与文档提供统一定义。
    meta:
      # CRUD 与 DDL 共用主键语义，MySQL 整数主键映射为自增。
      defaults:
        id-policy: DATABASE
        service: mini-commerce
      base-packages:
        - com.example.minicommerce.*.entity

    crud:
      # HTTP 接口：只开放主数据与订单，订单明细保留内部 DAO 能力。
      controller:
        enabled: true
        include-entities: [product, customer, order]
      # 写入契约：创建请求必须显式提供的字段。
      contracts:
        create:
          input-required-fields:
            product: [name, price, active]
            customer: [displayName, email]

      # 演示主体 local-developer 与全量数据范围，由 Starter 提供。
      # 读取可见性仍会进一步约束商品查询；生产接入应替换演示身份与数据范围。
      example:
        enabled: true
      governance:
        # 固定业务入口；管理端对照演示通过启动参数改为 management。
        access-entry: consumer
        # 客户不开放删除，避免订单失去关联；订单只允许读取与下单。
        grants:
          local-developer:
            - product:*
            - customer:read
            - customer:create
            - customer:update
            - order:read
            - order:place
        # 商品读取：消费者只看启用商品，管理端允许全部状态。
        read-visibility:
          product:
            consumer:
              active: true
            management: all
        # 示例无需额外审计表。
        audit:
          persist-to-jdbc: false

    # 实体文档：限定访问主体，默认展示 Meta 注册的全部实体与非隐藏字段。
    doc:
      contract:
        enabled: true
        exposure:
          subject-ids: [local-developer]
        http:
          enabled: true
