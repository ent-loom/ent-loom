# 运行基础：本地与 Compose 使用同一组环境变量。
spring:
  config:
    import:
      - classpath:demo.yml
      - optional:file:./.env[.properties]
  application:
    name: mini-commerce-spring-boot
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:mini_commerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:mini_commerce}
    password: ${MYSQL_PASSWORD:mini_commerce_dev}

server:
  port: ${APP_PORT:8082}

ent:
  loom:
    # CRUD、DDL 与文档共用实体元数据。
    meta:
      defaults:
        id-policy: DATABASE
        service: mini-commerce
      base-packages:
        - com.example.minicommerce.*.entity

    crud:
      # 业务访问：谁能执行什么操作、访问哪些数据与字段。
      access:
        # ID 字段默认采用“身份码 + Id”。
        identities:
          customer:
            id-type: LONG
          merchant:
            id-type: LONG
        # 已有关系字段默认推导为归属字段并保护写入；策略范围采用同名身份关系。
        relations:
          merchant:
            field: merchantId
          customer:
            field: customerId
        # 项目按业务规则定义模板，实体通过对应业务分类接口选择。
        policies:
          # 客户只读本人记录。
          customer-record:
            customer:
              actions: [view]
          # 商家只读本人记录。
          merchant-record:
            merchant:
              actions: [view]
          # 商家读取、维护本人数据；字段差异由实体约束。
          merchant-data:
            merchant:
              actions: [view, update]
          # 订单由客户与商家分别按自己的归属读取。
          order-entries:
            customer:
              actions: [view]
            merchant:
              actions: [view]
        # 通用 CRUD HTTP 实体清单；列出的实体默认开放接口，差异配置就近声明。
        entities:
          customer:
          order:
        # 实体 → 身份 → 用途；RETURN/FILTER 沿用缺省，WRITE 必须显式授权。
        field-plans:
          merchantProduct:
            merchant:
              WRITE:
                mode: INCLUDE
                fields: [name, price, active]
      # 通用 HTTP 仅开放客户与结算单。
      controller:
        enabled: true
      # 写入契约：创建请求必须显式提供的字段。
      contracts:
        create:
          input-required-fields:
            customer: [displayName, email]
    # 按实体元数据创建缺失表。
    ddl:
      mode: CREATE_MODIFY_TABLE_AND_METAS
    # 实体文档仅向演示主体开放。
    doc:
      contract:
        enabled: true
        exposure:
          subject-ids: [local-developer]
        http:
          enabled: true
