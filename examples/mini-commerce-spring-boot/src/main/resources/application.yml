# 运行基础：本地与 Compose 使用同一组环境变量。
spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: mini-commerce-spring-boot
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:mini_commerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:mini_commerce}
    password: ${MYSQL_PASSWORD:mini_commerce_dev}

server:
  port: ${APP_PORT:8082}

ent:
  loom:
    # 默认复用 Meta 扫描的实体创建缺失的表；不修改已有表结构或清空数据。
    ddl:
      mode: CREATE_TABLE
    # 实体元数据：只扫描业务实体包，为 CRUD、DDL 与文档提供统一定义。
    meta:
      # CRUD 与 DDL 共用主键语义，MySQL 整数主键映射为自增。
      defaults:
        id-policy: DATABASE
        service: mini-commerce
      base-packages:
        - com.example.minicommerce.*.entity

    crud:
      # HTTP 接口：默认开放全部已注册实体，仅排除订单明细；新增实体会自动获得路由。
      controller:
        enabled: true
        exposure-mode: ALL_REGISTERED
        exclude-entities:
          - order_item
      # 写入契约：创建请求必须显式提供的字段。
      contracts:
        create:
          input-required-fields:
            product: [name, price, active]
            customer: [displayName, email]

      # 仅为本示例提供一个固定请求主体和全量数据范围，便于直接运行。
      # 这不是登录、角色或生产授权配置；生产接入应替换主体解析和数据范围实现。
      example:
        enabled: true
        # 所有请求共用此主体，无需登录；须与下方 grants 的主体键对应。
        subject-id: local-developer
        # 显式展示演示默认值：Gateway 与 DAO 不限制数据归属，读取可见性仍单独生效。
        allow-all-data-scope: true
      governance:
        # 整个应用固定使用的业务入口，不是登录身份或角色；切换入口不会切换主体及其权限。
        # consumer=消费者，merchant=商家，management=平台管理；名称由业务应用约定。
        # 当前仅配置 consumer / management；merchant 读取商品会因缺少可见性绑定而拒绝。
        # 多端同时访问时，应由服务端根据已认证身份与受保护路由解析入口，详见 README。
        access-entry: consumer
        # 示例主体的业务权限清单：subject -> resource:action。
        # * 通配该资源的操作与场景，仍受动作准入等约束；place 是显式下单动作。
        # grants 按主体匹配，不会按 access-entry 自动分组；消费者入口也保留演示商品写权限。
        # 正式接入应按登录主体解析角色权限，避免把这里的演示权限当作消费者角色。
        grants:
          local-developer:
            - product:*
            - customer:read
            - customer:create
            - customer:update
            - order:read
            - order:place
        # 读取可见性按入口限制商品状态：消费者只看启用商品，管理入口可看全部。
        # 可见性不会授予权限；请求仍须先通过 grants 和动作准入。
        # all 仅表示不追加商品状态限制，不会绕过数据归属范围；此处也不控制商品写入。
        # 商家“只看自己的商品”需补充商品归属字段和动态数据范围，不能仅增加 merchant: all。
        read-visibility:
          product:
            consumer:
              active: true
            management: all
        # 示例无需额外审计表。
        audit:
          persist-to-jdbc: false

    # 实体文档：限定访问主体，默认展示 Meta 注册的全部实体与非隐藏字段。
    doc:
      contract:
        enabled: true
        exposure:
          subject-ids: [local-developer]
        http:
          enabled: true
