# 演示认证与环境设置：由 application.yml 显式导入，无需额外启用 Profile。
# 本文件提供静态凭证、身份归属和服务端入口，不声明实体操作、数据范围或字段权限。
# identity.code 关联 CommerceAccessConfiguration 的身份定义，并选择实体注解中的同名授权分支。
# 正式应用应接入可信认证与身份归属来源，复用全局策略及实体授权声明。
ent:
  loom:
    crud:
      example:
        enabled: true
        # 账号归属由服务端核验；身份码引用 access.identities，ID 按其类型转换。
        accounts:
          - token: demo-platform-admin
            subject-id: platform-admin
            identity:
              code: super-admin
              id: 1
          - token: demo-customer-a
            subject-id: customer-user-a
            identity:
              code: customer
              id: 301
          - token: demo-customer-b
            subject-id: customer-user-b
            identity:
              code: customer
              id: 302
          - token: demo-merchant-a
            subject-id: merchant-user-a
            identity:
              code: merchant
              id: 1001
          - token: demo-merchant-b
            subject-id: merchant-user-b
            identity:
              code: merchant
              id: 2001
        # 演示入口由服务端路由确定，不能由客户端切换；入口本身不授予实体权限。
        default-access-entry: consumer
        routes:
          - path: /api/ent-crud/order/**
            entry: commerce
          - path: /api/ent-crud/merchantProduct/**
            entry: merchant
          - path: /api/merchant/products/**
            entry: merchant
          - path: /api/ent-crud/merchantArticle/**
            entry: merchant
      governance:
        # 演示无需额外审计表。
        audit:
          persist-to-jdbc: false
