ent:
  loom:
    meta:
      # P1｜接入必填：声明本示例参与 Meta -> CRUD / DOC 投影的实体。
      entity-class-names:
        - com.example.minicommerce.product.entity.Product
        - com.example.minicommerce.customer.entity.Customer
        - com.example.minicommerce.order.entity.Order
        - com.example.minicommerce.order.entity.OrderItem
      # P1｜启用 CRUD 能力时推荐显式声明。
      crud:
        enabled: true
      # P1｜启用实体文档能力时推荐显式声明。
      doc:
        enabled: true

    doc:
      contract:
        # P1｜需要文档 HTTP 端点时必须开启。
        enabled: true
        exposure:
          # P1｜HTTP 暴露必须显式打开，并配合主体与字段白名单。
          enabled: true
          subject-ids: [local-developer]
          fields:
            product: [id, name, price, active]
            customer: [id, displayName, email]
        http:
          enabled: true
    crud:
      contracts:
        create:
          input-required-fields:
            product: [name, price, active]
            customer: [displayName, email]
        update:
          forbidden-fields:
            product: [id]
            customer: [id]
      # P1｜本地示例需要稳定的主体和全量数据范围；生产环境应替换为正式治理实现。
      example:
        enabled: true
      controller:
        # P1｜使用框架默认 HTTP CRUD 时开启。
        enabled: true
        # P1｜明确暴露实体，避免默认全量路由。
        include-entities:
          - product
          - customer
          - order  # 订单仅授权下单与详情场景，见下方 permission-rules
      query:
        enabled: true
      command:
        enabled: true
      # P1｜本示例不提供导入导出能力，显式关闭默认开启的模块。
      import:
        enabled: false
      export:
        enabled: false
      governance:
        # 安全边界｜存在 HTTP/CRUD 暴露时必须配置，默认拒绝未知访问。
        permission-rules:
          - resource: order
            action: COMMAND:ACTION
            scene: place
            decision: ALLOW
            subject-ids:
              - local-developer
          - resource: order
            action: QUERY:DETAIL
            scene: detail
            decision: ALLOW
            subject-ids:
              - local-developer
          - resource: product
            action: '*'
            scene: '*'
            decision: ALLOW
            subject-ids:
              - local-developer
          - resource: customer
            action: '*'
            scene: '*'
            decision: ALLOW
            subject-ids:
              - local-developer
        # P2｜本地示例关闭 JDBC 审计，避免引入额外审计表；生产环境按审计要求开启。
        audit:
          persist-to-jdbc: false
