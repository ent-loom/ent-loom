ent:
  loom:
    meta:
      entity-class-names:
        - com.example.customerprofile.CustomerProfile
      crud:
        enabled: true
      doc:
        enabled: true

    doc:
      contract:
        enabled: true
        exposure:
          subject-ids: [local-developer]
          include-entities: [customer_profile]
          fields:
            customer_profile: [id, displayName, email]
        http:
          enabled: true
    crud:
      identities:
        operator:
          id-type: LONG
      example:
        enabled: true
        accounts:
          - token: demo-profile-admin
            subject-id: local-developer
            identity:
              code: operator
              id: 1
      controller:
        enabled: true
        base-path: /api/ent-crud
      query:
        enabled: true
      command:
        enabled: true
      import:
        enabled: false
      export:
        enabled: false
      sql-log:
        mode: SAFE
      governance:
        audit:
          persist-to-jdbc: false
