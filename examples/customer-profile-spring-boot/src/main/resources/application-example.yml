ent:
  loom:
    meta:
      entity-class-names:
        - com.example.customerprofile.CustomerProfile
      crud:
        enabled: true
      doc:
        enabled: true

    doc:
      contract:
        enabled: true
        exposure:
          enabled: true
          subject-ids: [local-developer]
          fields:
            customer_profile: [id, displayName, email]
        http:
          enabled: true
    crud:
      contracts:
        create:
          input-required-fields:
            customer_profile: [displayName, email]
        update:
          forbidden-fields:
            customer_profile: [id]
      example:
        enabled: true
      controller:
        enabled: true
        base-path: /api/ent-crud
        include-entities:
          - customer_profile
      query:
        enabled: true
      command:
        enabled: true
      import:
        enabled: false
      export:
        enabled: false
      sql-log:
        mode: safe
      governance:
        permission-rules:
          - resource: customer_profile
            action: '*'
            scene: '*'
            decision: ALLOW
            subject-ids:
              - local-developer
        audit:
          persist-to-jdbc: false
