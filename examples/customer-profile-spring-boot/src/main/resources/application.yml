spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: customer-profile-spring-boot
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:customer_profile}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:customer_profile}
    password: ${MYSQL_PASSWORD:customer_profile_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  profiles:
    group:
      dev:
        - example
      verify:
        - example

server:
  port: ${APP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
